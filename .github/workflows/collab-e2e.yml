name: CI — Tests (unit / integration / e2e)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install deps
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit --silent -- --runInBand

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install deps
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration --silent -- --runInBand

  e2e-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install deps
        run: npm ci

      - name: Run tests (e2e)
        run: npm run test:e2e --silent -- --runInBand

  browser-e2e:
    runs-on: ubuntu-latest
    needs: e2e-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install deps
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run browser e2e tests
        run: npm test -- tests/e2e/collab-browser.test.js --runInBand

  visual-diff:
    runs-on: ubuntu-latest
    needs: browser-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install deps
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run visual snapshot tests
        id: visual
        run: npm test -- tests/e2e/visual-snapshot.test.js --runInBand
        continue-on-error: true

      - name: Upload visual snapshot artifacts
        if: ${{ steps.visual.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: tests/__image_snapshots__

      - name: Build visual-diff comment body
        id: build_comment
        if: ${{ steps.visual.outcome == 'failure' && github.event_name == 'pull_request' }}
        run: |
          echo "Gathering snapshot files..."
          mkdir -p tmp_snapshot_comment
          out=tmp_snapshot_comment/body.md
          echo "# Visual snapshot diffs for run $GITHUB_RUN_ID" > $out
          echo "Artifacts: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> $out
          echo "\n" >> $out
          find tests/__image_snapshots__ -type f -name '*.png' | while read -r f; do
            echo "### $(basename "$f")" >> $out
            # embed small inline thumbnail (base64) - caution: this can make the comment large
            base64 -w0 "$f" > tmp_snapshot_comment/tmpbase64
            echo "![$(basename $f)](data:image/png;base64,$(cat tmp_snapshot_comment/tmpbase64))" >> $out
            echo "\n" >> $out
          done
          echo "Done."
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat $out >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment on PR with visual diff notice
        if: ${{ steps.visual.outcome == 'failure' && github.event_name == 'pull_request' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: ${{ steps.build_comment.outputs.body }}

      - name: Fail job if visual diffs exist
        if: ${{ steps.visual.outcome == 'failure' }}
        run: exit 1
