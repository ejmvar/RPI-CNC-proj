name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out the form below to help us understand your request.

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: A brief summary of the feature you'd like to see
      placeholder: Add support for multi-axis CNC machines (4th and 5th axis)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem It Solves
      description: What problem does this feature solve? Is your feature request related to a problem?
      placeholder: |
        I'm frustrated when trying to simulate 4-axis rotary operations because...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: |
        Add a rotary axis (A-axis) visualization...
        - Toggle 4th axis mode
        - Show rotation in 3D view
        - Parse A/B/C axis commands
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: I currently use external software for 4-axis visualization, but it would be better to have it integrated...

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical - Blocking my work
        - High - Would significantly improve my workflow
        - Medium - Nice to have
        - Low - Minor improvement
    validations:
      required: true

  - type: dropdown
    id: use-case
    attributes:
      label: Use Case
      description: What type of work would this feature support?
      options:
        - Professional/Commercial
        - Hobbyist/Personal
        - Educational
        - Research
        - Other
    validations:
      required: false

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / Examples
      description: If you have mockups, screenshots, or examples from other software, please share them
      placeholder: Drag and drop images or paste URLs to similar features in other tools

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Ideas
      description: (Optional) If you have technical ideas on how to implement this, share them here
      placeholder: |
        This could be implemented by...
        - Extending the G-Code parser to handle A/B/C commands
        - Adding a RotationHelper class in presentation layer
        - etc.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other information that might be helpful
      placeholder: This feature is commonly found in commercial CAM software like Fusion 360, Mastercam...

  - type: checkboxes
    id: contributing
    attributes:
      label: Contribution
      description: Would you be willing to contribute to this feature?
      options:
        - label: I would like to implement this feature myself
          required: false
        - label: I can help with testing
          required: false
        - label: I can provide feedback during development
          required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have provided a clear description of the feature
          required: true
        - label: This feature aligns with the project's goals
          required: false
