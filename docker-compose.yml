version: '3.8'

services:
  # Frontend - CNC Simulator Web Interface
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cnc-simulator-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - cnc-network
    environment:
      - WEBSOCKET_URL=ws://localhost:8765
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Backend - WebSocket Collaborative Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cnc-simulator-backend
    ports:
      - "8765:8765"
    restart: unless-stopped
    networks:
      - cnc-network
    environment:
      - PORT=8765
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=cnc_simulator
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8765/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); });\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cnc-simulator-postgres
    environment:
      - POSTGRES_DB=cnc_simulator
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - cnc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./modules/backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

networks:
  cnc-network:
    driver: bridge

volumes:
  backend-data:
    driver: local
  backend-logs:
    driver: local
  postgres-data:
    driver: local
