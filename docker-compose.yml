version: '3.8'

services:
  # Frontend - CNC Simulator Web Interface
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cnc-simulator-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - cnc-network
    environment:
      - WEBSOCKET_URL=ws://localhost:8765
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Backend - WebSocket Collaborative Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cnc-simulator-backend
    ports:
      - "8765:8765"
    restart: unless-stopped
    networks:
      - cnc-network
    environment:
      - PORT=8765
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const ws = require('ws'); const client = new ws('ws://localhost:8765'); client.on('open', () => { client.close(); process.exit(0); }); client.on('error', () => process.exit(1));\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - backend-data:/app/data

networks:
  cnc-network:
    driver: bridge

volumes:
  backend-data:
    driver: local
